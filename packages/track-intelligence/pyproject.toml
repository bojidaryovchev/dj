[project]
name = "dj-track-intelligence"
version = "0.1.0"
description = "Audio analysis engine for DJs: key, Camelot, tempo and tonal structure."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Result models, configuration and validation.
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    # Numerics. Everything downstream of the decoder is ndarray-shaped.
    "numpy>=1.26",
    # Default analysis backend. Portable (pure-python + numba wheels on every
    # platform) which is what makes the engine runnable on Windows, where
    # Essentia has no wheels at all. See README > Analysis engines.
    "librosa>=0.10.2",
    # Resampler. Pulled in by librosa anyway, but the decoder uses it
    # directly to hand analysers a cheaper sample rate, so it is declared.
    "soxr>=0.3.7",
    # HTTP surface.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # CLI surface.
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Essentia ships manylinux + macOS wheels only. Installing this extra on
# Windows will fail at resolution time, which is why it is not a hard
# dependency -- the Docker image and Linux/macOS installs get it, Windows
# falls back to the librosa backend.
essentia = ["essentia>=2.1b6.dev1110"]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",       # fastapi TestClient transport
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
dj-analyze = "dj_intelligence.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dj_intelligence"]

# --- tooling --------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "S",         # bandit -- this service eats untrusted files
]
ignore = [
    "S101",   # assert: fine in tests
    "B008",   # FastAPI/Typer put callables in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
# Neither librosa nor essentia ship type information.
[[tool.mypy.overrides]]
module = ["librosa.*", "essentia.*", "scipy.*", "soundfile.*", "soxr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises the full pipeline against generated audio (slower)",
    "essentia: requires the Essentia backend to be installed",
]
filterwarnings = [
    "ignore::DeprecationWarning:librosa.*",
]
